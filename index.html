<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Thaer M Barakat — This blog has moved</title>
<meta name="description" content="This blog has moved to theflowminds.com/blog." />
<meta name="robots" content="noindex, follow" />
<link rel="canonical" href="https://theflowminds.com/blog/" />
<meta property="og:title" content="This blog has moved" />
<meta property="og:description" content="This blog has moved to theflowminds.com/blog." />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://theflowminds.com/blog/" />

<style>
  :root {
    --bg-1: #0B1F33;
    --bg-3: #3A5A78;
    --paper: #FBFAF6;
    --ink: #0B1F33;
    --muted: #6B7280;
    --accent: #2FB8C6;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, var(--bg-1) 0%, var(--bg-3) 100%);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    padding: 24px;
  }
  .card {
    max-width: 480px;
    width: 100%;
    background: var(--paper);
    border-radius: 16px;
    padding: 48px 36px;
    text-align: center;
    box-shadow: 0 24px 60px rgba(0,0,0,.35);
  }
  h1 {
    font-size: 1.5rem;
    color: var(--ink);
    margin: 0 0 12px;
  }
  p {
    color: var(--muted);
    line-height: 1.6;
    margin: 0 0 28px;
  }
  a.btn {
    display: inline-block;
    background: var(--accent);
    color: #fff;
    text-decoration: none;
    font-weight: 600;
    padding: 12px 28px;
    border-radius: 999px;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>This blog has moved</h1>
    <p>All posts now live at theflowminds.com/blog.</p>
    <a class="btn" href="https://theflowminds.com/blog/">Go to the new blog →</a>
  </div>
</body>
</html>
